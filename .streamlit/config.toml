# Custom theme -- deliberately plain and dense (Dataroma reference), not
# the earlier "designed dashboard" look: sharp corners, small font, flat
# backgrounds, thin gridlines, no card/shadow chrome. Chart color tokens
# are untouched from the dataviz skill's validated reference palette
# (references/palette.md) -- overall chrome density is a separate
# decision from color-science correctness, so only spacing/radius/font/
# background tokens changed in this pass.
#
# Dataroma itself has no dark mode -- it is unconditionally white -- so
# [theme.dark] below is deliberately NOT a real dark palette; it mirrors
# [theme.light] almost exactly. Without this, a viewer whose OS/browser
# prefers dark (or who flips Streamlit's own light/dark toggle) would see
# a dark page even though every other design decision here targets an
# always-white Dataroma look. Status/chart colors stay identical either way.

[theme]
base = "light"
font = "sans serif"
baseFontSize = 13
baseRadius = "none"
buttonRadius = "none"
showSidebarBorder = true
showWidgetBorder = false

# Fixed categorical order (identity) -- 8 hues, never cycled, never reordered
# per series. Same order in both modes; each mode uses that mode's step.
chartCategoricalColors = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]
# NOTE: chartSequentialColors / chartDivergingColors are top-level-only keys
# (Streamlit does not support a per-mode override for them), so one array
# serves both themes; picked as the light-mode direction since chart
# backgrounds stay light-surfaced in both modes for line/bar charts here.
# Both MUST have exactly 10 entries or Streamlit silently discards the
# whole array and falls back to its own defaults (confirmed via a runtime
# "should have 10 color values" warning) -- 8 and 3 entries respectively
# were passing silently unused before this fix.
#
# Sequential: 10 of palette.md's documented light->dark blue steps
# (100,150,200,300,350,400,450,500,600,700 -- skipping a few of the 13
# available to land on exactly 10, no invented hex values).
chartSequentialColors = [
    "#cde2fb", "#b7d3f6", "#9ec5f4", "#6da7ec", "#5598e7",
    "#3987e5", "#2a78d6", "#256abf", "#184f95", "#0d366b",
]
# Diverging: palette.md documents only the two pole colors + neutral
# midpoint, not a full stepped ramp -- these are a straight linear RGB
# interpolation between those three documented values (5 steps per arm,
# reaching both true endpoints), not eyeballed intermediate hex codes.
chartDivergingColors = [
    "#d03b3b", "#d86867", "#e09594", "#e8c2c0", "#f0efec",
    "#f0efec", "#bed1e6", "#8db4e1", "#5c96dc", "#2a78d6",
]

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#000000"
primaryColor = "#2a78d6"
borderColor = "rgba(0,0,0,0.14)"
linkColor = "#2a78d6"
dataframeBorderColor = "#dcdcdc"
dataframeHeaderBackgroundColor = "#eeeeee"

blueColor = "#2a78d6"
greenColor = "#0ca30c"
redColor = "#d03b3b"
orangeColor = "#eb6834"
yellowColor = "#eda100"
violetColor = "#4a3aa7"
grayColor = "#898781"

[theme.light.sidebar]
# Same as the page background (no tinted "card" look) -- the filter
# panel reads as part of the page, not a separate boxed widget.
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
borderColor = "rgba(0,0,0,0.14)"

[theme.dark]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#000000"
primaryColor = "#2a78d6"
borderColor = "rgba(0,0,0,0.14)"
linkColor = "#2a78d6"
dataframeBorderColor = "#dcdcdc"
dataframeHeaderBackgroundColor = "#eeeeee"

blueColor = "#2a78d6"
greenColor = "#0ca30c"
redColor = "#d03b3b"
orangeColor = "#eb6834"
yellowColor = "#eda100"
violetColor = "#4a3aa7"
grayColor = "#898781"

[theme.dark.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
borderColor = "rgba(0,0,0,0.14)"
