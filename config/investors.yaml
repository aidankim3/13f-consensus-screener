# 13F 컨센서스 스크리너 - 추적할 투자자 목록
#
# cik는 SEC EDGAR의 Central Index Key (10자리, 앞자리 0 포함 여부는 무관 —
# 코드에서 normalize_cik()로 10자리 zero-pad 정규화함).
#
# 각 CIK는 실제 조회로 확인했다 (이름만 보고 추측해 넣지 않음):
#   1) https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&company=<이름>&type=13F-HR&output=atom
#      로 후보 CIK들을 찾고,
#   2) https://data.sec.gov/submissions/CIK##########.json 의 "name" 필드와
#      최근 filings.recent.form 목록이 실제로 13F-HR을 최근에 제출하는지로
#      최종 CIK를 확정했다 (동명이인/구 등록 엔티티 배제).
# 검증 스크립트: scripts/verify_investor_ciks.py
#
# 아래 "Dataroma 83 Superinvestors" 구간은 dataroma.com/m/home.php의 투자자 목록을
# 기준으로, scripts/find_investor_ciks.py + scripts/retry_*.py로 일괄 조회·검증해
# 추가했다 (2026-08-14). 각 항목의 dataroma_code로 원본과 대조 가능. Mohnish Pabrai
# 1명은 활성 CIK를 찾지 못해 제외했다 (사유는 파일 맨 아래 주석 참고).
